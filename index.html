<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Malgun Gothic','맑은 고딕',sans-serif;background:#f0f4f8;color:#2d3748;font-size:14px;}

.app-header{background:linear-gradient(135deg,#1a365d,#2a4a7f);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}

.av-me{background:#3b82f6;} .av-s1{background:#10b981;} .av-s2{background:#f59e0b;}
.mtab .rbadge{font-size:10px;padding:2px 6px;border-radius:10px;background:rgba(255,255,255,.15);color:rgba(255,255,255,.75);}

.rtab{padding:12px 22px;cursor:pointer;font-size:13px;font-weight:600;color:#718096;border-bottom:3px solid transparent;display:flex;align-items:center;gap:6px;transition:all .15s;}

.rbox{max-width:940px;margin:22px auto;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.08);overflow:hidden;}

.rhead{padding:20px 30px;display:flex;align-items:center;justify-content:space-between;color:#fff;}

.meta-bar{background:#f7faff;border-bottom:1px solid #e2e8f0;padding:11px 30px;display:flex;gap:20px;flex-wrap:wrap;align-items:center;}
.mi{display:flex;align-items:center;gap:6px;}
.mi label{font-size:11px;color:#718096;font-weight:600;}
.mi input,.mi select{border:1px solid #cbd5e0;border-radius:5px;padding:4px 8px;font-size:12px;font-family:inherit;color:#2d3748;background:#fff;}

.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid #e2e8f0;}
.kcard{padding:13px 14px;border-right:1px solid #e2e8f0;text-align:center;}

<script>
// ═══════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════
const MEMBERS = [
  {id:'me', label:'나 (작성자)', role:'팀장', av:'나', avcls:'av-me', teamPH:'예) 미국유학팀'},
  {id:'s1', label:'스태프 1',    role:'직원', av:'S1', avcls:'av-s1', teamPH:'예) 영국유학팀'},
  {id:'s2', label:'스태프 2',    role:'직원', av:'S2', avcls:'av-s2', teamPH:'예) 호주유학팀'},
];

const DAY_NAMES = ['월','화','수','목','금'];
const DAY_FULL  = ['월요일','화요일','수요일','목요일','금요일'];
const DAYS = ['mon','tue','wed','thu','fri'];

const CAT_OPTS   = ['입학지원','비자','서류작업','상담','학교연락','숙소','내부회의','기타'];
const STAGE_OPTS = ['초기상담','서류준비','원서접수','합격/오퍼','비자준비','출국준비','재학중','사후관리'];
const PRI_OPTS   = ['🔴 높음','🟠 중간','🟢 낮음'];
const STATUS_OPTS= ['완료','진행중','보류','이월'];
const CONTACT_OPTS = ['이메일','전화','화상미팅','문자/카톡','포털'];
const RESOLVE_OPTS = ['처리완료','답장대기','미처리'];
const SEV_OPTS   = ['🔴 긴급','🟠 높음','🟡 보통','🟢 낮음'];
const ISSUE_STATUS = ['해결완료','처리중','모니터링','미해결'];

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
const today = new Date();
const fmt = d => {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
};
const pad = n => String(n).padStart(2,'0');
const todayStr = fmt(today);

function getWeekStr(d) {
  const t = new Date(d);
  t.setHours(0,0,0,0);
  t.setDate(t.getDate() + 3 - ((t.getDay()+6)%7));
  const w1 = new Date(t.getFullYear(),0,4);
  const wn = 1 + Math.round(((t-w1)/86400000 - 3 + ((w1.getDay()+6)%7))/7);
  return `${t.getFullYear()}-W${pad(wn)}`;
}

function getWeekDates(weekStr) {
  const [yr, wn] = weekStr.split('-W').map(Number);
  const jan4 = new Date(yr,0,4);
  const mon = new Date(jan4);
  mon.setDate(jan4.getDate() - ((jan4.getDay()+6)%7) + (wn-1)*7);
  return Array.from({length:5}, (_,i) => { const d=new Date(mon); d.setDate(mon.getDate()+i); return fmt(d); });
}

function koDate(d) {
  return new Date(d+'T00:00:00').toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
}
function koWeekRange(weekStr) {
  const dates = getWeekDates(weekStr);
  const ko = d => new Date(d+'T00:00:00').toLocaleDateString('ko-KR',{month:'long',day:'numeric'});
  const wn = weekStr.split('-W')[1];
  return `${ko(dates[0])} ~ ${ko(dates[4])} · 제${wn}주차`;
}

function sel(opts, val='') {
  return `<select>${opts.map(o=>`<option${o===val?' selected':''}>${o}</option>`).join('')}</select>`;
}

// ═══════════════════════════════════════════════
// FIREBASE CONFIG
// ═══════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyDS1eB0lu7ffnT3DHyEHFdlkLuG-ujogq0",
  authDomain: "eduin-sydney-bbd60.firebaseapp.com",
  projectId: "eduin-sydney-bbd60",
  storageBucket: "eduin-sydney-bbd60.firebasestorage.app",
  messagingSenderId: "117941433369",
  appId: "1:117941433369:web:1ae8df7f16e1504c00e688",
  measurementId: "G-RGBGK33GTD"
};
firebase.initializeApp(firebaseConfig);
const db   = firebase.firestore();
const auth = firebase.auth();

// 허가된 팀원 이메일
const ALLOWED_EMAILS = [
  'ddubell81@gmail.com',
  'eduinsydney@gmail.com',
  'koreaeduin7@gmail.com'
];

// ═══════════════════════════════════════════════
// AUTH FUNCTIONS
// ═══════════════════════════════════════════════
function signInWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  document.getElementById('login-error').textContent = '';
  auth.signInWithPopup(provider).catch(err => {
    document.getElementById('login-error').textContent = '로그인 오류: ' + err.message;
  });
}

function signOutUser() {
  auth.signOut();
}

auth.onAuthStateChanged(user => {
  if (user && ALLOWED_EMAILS.includes(user.email)) {
    // 허가된 팀원 — 앱 표시
    document.getElementById('login-overlay').classList.add('hidden');
    document.getElementById('user-info').style.display = 'flex';
    document.getElementById('user-avatar').src = user.photoURL || '';
    document.getElementById('user-name').textContent = user.displayName || user.email;
    document.getElementById('save-indicator').style.display = 'flex';
    if (!window._appInitialized) { window._appInitialized = true; init(); }
    else { MEMBERS.forEach(cfg => loadDailyView(cfg.id, todayStr)); }
  } else if (user) {
    // 로그인했지만 허가 안 된 계정
    auth.signOut();
    document.getElementById('login-error').textContent =
      '접근 권한이 없는 계정입니다: ' + user.email;
    document.getElementById('login-overlay').classList.remove('hidden');
  } else {
    // 로그아웃 상태
    document.getElementById('login-overlay').classList.remove('hidden');
    document.getElementById('user-info').style.display = 'none';
  }
});

// ═══════════════════════════════════════════════
// STORAGE (Firebase + localStorage 하이브리드)
// ═══════════════════════════════════════════════
const S = {
  dKey: (m,d) => `daily_${m}_${d}`,
  wKey: (m,w) => `weekly_${m}_${w}`,

  // 저장: localStorage 즉시 + Firestore 백그라운드
  save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
    db.collection('reports').doc(key).set(val)
      .catch(e => console.error('Firebase 저장 오류:', e));
  },

  // 로드: localStorage에서 즉시 반환 (UI 빠르게)
  load(key) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch(e) { return null; }
  },

  // Firestore에서 최신 데이터 가져와 localStorage 동기화
  async syncFromCloud(key) {
    try {
      const snap = await db.collection('reports').doc(key).get();
      if (snap.exists) {
        const data = snap.data();
        localStorage.setItem(key, JSON.stringify(data));
        return data;
      }
    } catch(e) { console.error('Firebase 동기화 오류:', e); }
    return null;
  },

  // 실시간 구독 (다른 팀원이 저장하면 자동 반영)
  _listeners: {},
  subscribe(key, callback) {
    if (this._listeners[key]) this._listeners[key]();
    this._listeners[key] = db.collection('reports').doc(key)
      .onSnapshot(snap => {
        if (snap.exists) {
          const data = snap.data();
          try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) {}
          callback(data);
        }
      }, e => console.error('Firebase 리스너 오류:', e));
  },
  unsubscribe(key) {
    if (this._listeners[key]) { this._listeners[key](); delete this._listeners[key]; }
  }
};

// ═══════════════════════════════════════════════
function loadDailyView(m, date) {
  const data = S.load(S.dKey(m, date));
  if (data?.meta) {
    const n=document.getElementById(`${m}-d-name`); if(n)n.value=data.meta.name||'';
    const r=document.getElementById(`${m}-d-role`); if(r)r.value=data.meta.role||'';
    const t=document.getElementById(`${m}-d-team`); if(t)t.value=data.meta.team||'';
  }
  renderTable(`${m}-task`,    'task',    data?.tasks    || [[]]);
  renderTable(`${m}-student`, 'student', data?.students || [[]]);
  renderTable(`${m}-contact`, 'contact', data?.contacts || [[]]);
  renderTable(`${m}-tomorrow`, 'tomorrow', data?.tomorrow || [[]]);
  const iss = document.getElementById(`${m}-issues`);
  if (iss) iss.value = data?.issues||'';
  updateDailyHeader(m, date);
}

function loadWeeklyDayTab(m, dayIdx, weekStr) {
  const dates = getWeekDates(weekStr);
  const date  = dates[dayIdx];
  const panelId = `${m}-wpanel-${DAYS[dayIdx]}`;
  const panel = document.getElementById(panelId);
  if (!panel) return;

  const dateLabel = panel.querySelector('.week-day-date');
  if (dateLabel) dateLabel.textContent = koDate(date);

  const data = S.load(S.dKey(m, date));

  // Tasks
  const taskTbody = panel.querySelector('.w-task-body');
  if (taskTbody) {
    if (data?.tasks?.length) {
      taskTbody.innerHTML = data.tasks.map(r=>renderRow('task',r)).join('');
    } else {
      taskTbody.innerHTML = `<tr><td colspan="7" class="no-data-msg">해당일 일일보고서 없음</td></tr>`;
    }
  }
  // Students
  const stuTbody = panel.querySelector('.w-stu-body');
  if (stuTbody) {
    if (data?.students?.length) {
      stuTbody.innerHTML = data.students.map(r=>renderRow('student',r)).join('');
    } else {
      stuTbody.innerHTML = `<tr><td colspan="6" class="no-data-msg">해당일 학생 데이터 없음</td></tr>`;
    }
  }
  // Go to daily link
  const goBtn = panel.querySelector('.go-daily-btn');
  if (goBtn) {
    goBtn.onclick = () => {
      const dDateEl = document.getElementById(`${m}-d-date`);
      if (dDateEl) {
        dDateEl.value = date;
        loadDailyView(m, date);
      }
      switchReport(m, 'daily', document.querySelector(`#panel-${m} .rtab`));
    };
  }
}

function loadWeeklyView(m, weekStr) {
  const wData = S.load(S.wKey(m, weekStr));
  if (wData?.meta) {
    const n=document.getElementById(`${m}-w-name`); if(n)n.value=wData.meta.name||'';
    const t=document.getElementById(`${m}-w-team`); if(t)t.value=wData.meta.team||'';
  }
  // KPI
  const kpiInputs = document.querySelectorAll(`#${m}-kpi .kv input`);
  (wData?.kpi||[]).forEach((v,i)=>{ if(kpiInputs[i]) kpiInputs[i].value=v; });
  // Weekly-specific tables
  renderTable(`${m}-wstudent`, 'wstudent', wData?.wstudents||[[]]);
  renderTable(`${m}-wissue`,   'issue',    wData?.issues   ||[[]]);
  renderTable(`${m}-nextweek`, 'nextweek', wData?.nextweek ||[[]]);
  // Progress
  if (wData?.prog) {
    const cont = document.getElementById(`${m}-prog`);
    if (cont) {
      cont.innerHTML = wData.prog.map(([label,pct])=>progRowHtml(label,pct)).join('');
    }
  }
  // Summary
  ['good','improve','suggest'].forEach(k=>{
    const el=document.getElementById(`${m}-sum-${k}`); if(el)el.value=wData?.summary?.[k]||'';
  });
  // Load all day tabs
  DAYS.forEach((_,i)=>loadWeeklyDayTab(m,i,weekStr));
  // Update header
  updateWeeklyHeader(m, weekStr);
}

// ═══════════════════════════════════════════════
// AUTO-SAVE (debounced)
// ═══════════════════════════════════════════════
let saveTimer = null;
function triggerSave(m) {
  setSaveDot('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ doSave(m); setSaveDot('saved'); }, 600);
}
function setSaveDot(state) {
  const dot = document.getElementById('save-dot');
  const txt = document.getElementById('save-txt');
  if (state==='saving') { dot.classList.add('saving'); if(txt)txt.textContent='저장 중...'; }
  else { dot.classList.remove('saving'); if(txt)txt.textContent=`자동저장 완료 ${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`; }
}
function doSave(m) {
  const activeView = document.querySelector(`#panel-${m} .report-view.active`);
  if (!activeView) return;
  if (activeView.id === `${m}-daily`) {
    const date = document.getElementById(`${m}-d-date`)?.value || todayStr;
    S.save(S.dKey(m,date), collectDaily(m));
    // Refresh weekly day tabs if weekly is loaded
    const weekStr = document.getElementById(`${m}-w-week`)?.value || getWeekStr(today);
    const dates = getWeekDates(weekStr);
    const dayIdx = dates.indexOf(date);
    if (dayIdx >= 0) loadWeeklyDayTab(m, dayIdx, weekStr);
  } else {
    const weekStr = document.getElementById(`${m}-w-week`)?.value || getWeekStr(today);
    S.save(S.wKey(m,weekStr), collectWeekly(m));
  }
}

// RENDER MEMBER PANELS
// ═══════════════════════════════════════════════
function buildUI() {
  const nav = document.getElementById('member-nav');
  const panels = document.getElementById('panels');
  MEMBERS.forEach((cfg,i) => {
    nav.insertAdjacentHTML('beforeend',`
      <div class="mtab${i===0?' active':''}" onclick="switchMember('${cfg.id}',this)" id="nav-${cfg.id}">
        <div class="av ${cfg.avcls}">${cfg.av}</div>
        <div>
          <div id="name-${cfg.id}-nav">${cfg.label}</div>
          <div class="rbadge" id="role-${cfg.id}-nav">${cfg.role}</div>
        </div>
      </div>`);
    panels.insertAdjacentHTML('beforeend',`
      <div class="member-panel${i===0?' active':''} theme-${cfg.id.replace('me','me')}" id="panel-${cfg.id}">
        <div class="report-nav">
          <div class="rtab active" onclick="switchReport('${cfg.id}','daily',this)">📋 일일 보고서</div>
          <div class="rtab" onclick="switchReport('${cfg.id}','weekly',this)">📊 주간 보고서</div>
        </div>
        <div class="report-view active" id="${cfg.id}-daily">${buildDailyHTML(cfg)}</div>
        <div class="report-view" id="${cfg.id}-weekly">${buildWeeklyHTML(cfg)}</div>
      </div>`);
  });
}

// ═══════════════════════════════════════════════
// NAV HANDLERS
// ═══════════════════════════════════════════════
function switchMember(id, el) {
  document.querySelectorAll('.mtab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.member-panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-'+id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function switchReport(m, type, el) {
  const panel = document.getElementById('panel-'+m);
  panel.querySelectorAll('.rtab').forEach(t=>t.classList.remove('active'));
  panel.querySelectorAll('.report-view').forEach(v=>v.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById(`${m}-${type}`).classList.add('active');
  window.scrollTo({top:56,behavior:'smooth'});
  // If switching to weekly, reload
  if (type==='weekly') {
    const wk = document.getElementById(`${m}-w-week`)?.value || getWeekStr(today);
    loadWeeklyView(m, wk);
  }
}

function switchWDay(m, day, el) {
  DAYS.forEach(d=>{
    const p=document.getElementById(`${m}-wpanel-${d}`); if(p)p.classList.remove('active');
  });
  el.closest('.section').querySelectorAll('.dtab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(`${m}-wpanel-${day}`).classList.add('active');
}

async function onDailyDateChange(m, date) {
  // 먼저 로컬 데이터로 즉시 표시
  loadDailyView(m, date);
  // Firestore에서 최신 데이터 동기화
  const data = await S.syncFromCloud(S.dKey(m, date));
  if (data) loadDailyView(m, date);
  // 실시간 구독 (다른 팀원 편집 즉시 반영)
  S.subscribe(S.dKey(m, date), () => loadDailyView(m, date));
}

async function onWeekChange(m, weekStr) {
  loadWeeklyView(m, weekStr);
  const data = await S.syncFromCloud(S.wKey(m, weekStr));
  if (data) loadWeeklyView(m, weekStr);
  S.subscribe(S.wKey(m, weekStr), () => loadWeeklyView(m, weekStr));
}

function manualSync(m) {
  const date = document.getElementById(`${m}-d-date`)?.value || todayStr;
  S.save(S.dKey(m,date), collectDaily(m));
  const weekStr = document.getElementById(`${m}-w-week`)?.value || getWeekStr(today);
  const dates = getWeekDates(weekStr);
  const dayIdx = dates.indexOf(date);
  if (dayIdx >= 0) loadWeeklyDayTab(m, dayIdx, weekStr);
  setSaveDot('saved');
  showToast('주간보고서에 반영 완료!');
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id='toast';
    t.style.cssText='position:fixed;bottom:24px;right:24px;background:#1a365d;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;transition:opacity .3s;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.opacity='1';
  setTimeout(()=>t.style.opacity='0',2000);
}

// PROGRESS BAR
// ═══════════════════════════════════════════════
function setP(wrap, e) {
  const rect=wrap.getBoundingClientRect();
  const pct=Math.round(((e.clientX-rect.left)/rect.width)*100);
  wrap.querySelector('.prog-fill').style.width=pct+'%';
  const inp=wrap.closest('.prog-item').querySelector('.prog-pct input');
  if(inp) inp.value=pct+'%';
}
function syncP(input) {
  const v=parseInt(input.value)||0;
  input.closest('.prog-item').querySelector('.prog-fill').style.width=Math.min(100,Math.max(0,v))+'%';
}

// EXCEL EXPORT (SpreadsheetML - no library needed)
// ═══════════════════════════════════════════════
function xlCell(v, type='String') {
  const safe=(v||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<Cell><Data ss:Type="${type}">${safe}</Data></Cell>`;
}
function xlRow(cells){ return `<Row>${cells.join('')}</Row>`; }
function xlHeaderRow(headers){ return xlRow(headers.map(h=>xlCell(h))); }

function buildXlSheet(name, headerRow, dataRows) {
  const rows = [headerRow, ...dataRows.map(r=>xlRow(r.map(v=>xlCell(v))))].join('');
  return `<Worksheet ss:Name="${name.replace(/[\\\/\?\*\[\]]/g,'_').slice(0,31)}">
    <Table DefaultColumnWidth="80">${rows}</Table>
  </Worksheet>`;
}

function exportExcel(m) {
  const weekStr = document.getElementById(`${m}-w-week`)?.value || getWeekStr(today);
  const dates   = getWeekDates(weekStr);
  const memberName = document.getElementById(`name-${m}-nav`)?.textContent || m;

  // First save current state
  const activeView = document.querySelector(`#panel-${m} .report-view.active`);
  if (activeView?.id===`${m}-weekly`) {
    S.save(S.wKey(m,weekStr), collectWeekly(m));
  }

  let sheets = '';

  // Day sheets (from daily data)
  DAY_FULL.forEach((dayName,i)=>{
    const data = S.load(S.dKey(m, dates[i]));
    const dateLabel = `${dayName} (${dates[i]})`;

    // Tasks sub-sheet
    const taskHeader = xlHeaderRow(['업무 내용','구분','담당 학생/기관','소요시간','진행 상태','비고']);
    const taskRows = (data?.tasks||[]).filter(r=>r.some(v=>v));
    sheets += buildXlSheet(DAY_NAMES[i]+'_업무', taskHeader,
      taskRows.length ? taskRows.map(r=>[r[0],r[1],r[2],r[3],r[4],r[5]]) : [['(데이터 없음)','','','','','']]);

    // Students sub-sheet
    const stuHeader = xlHeaderRow(['학생명','목표 국가/학교','진행 단계','D-day','우선순위','처리 내용']);
    const stuRows = (data?.students||[]).filter(r=>r.some(v=>v));
    sheets += buildXlSheet(DAY_NAMES[i]+'_학생', stuHeader,
      stuRows.length ? stuRows.map(r=>[r[0],r[1],r[2],r[3],r[4],r[5]]) : [['(데이터 없음)']]);
  });

  // Weekly summary sheet
  const wData = S.load(S.wKey(m, weekStr)) || {};

  // KPI row
  const kpiHeader = xlHeaderRow(['신규 상담','원서 접수','합격/오퍼','출국 완료','긴급 처리']);
  const kpiData   = wData.kpi || ['0','0','0','0','0'];
  sheets += buildXlSheet('주간_KPI', kpiHeader, [kpiData]);

  // Weekly student progress
  const wsHeader = xlHeaderRow(['학생명','목표 국가/학교','현재 단계','이번 주 진행','다음 주 목표','마감일','특이사항']);
  const wsRows   = (wData.wstudents||[]).filter(r=>r.some(v=>v));
  sheets += buildXlSheet('주간_학생진행', wsHeader,
    wsRows.length ? wsRows : [['(데이터 없음)']]);

  // Next week plan
  const nwHeader = xlHeaderRow(['계획 내용','구분','관련 학생/기관','완료 목표일','우선순위','준비 사항']);
  const nwRows   = (wData.nextweek||[]).filter(r=>r.some(v=>v));
  sheets += buildXlSheet('다음주_계획', nwHeader,
    nwRows.length ? nwRows.map(r=>[r[0],r[1],r[2],r[3],r[4],r[5]]) : [['(데이터 없음)']]);

  // Summary sheet
  const sumHeader = xlHeaderRow(['항목','내용']);
  sheets += buildXlSheet('주간_총평', sumHeader, [
    ['✅ 성과 / 잘된 점',   wData.summary?.good    || ''],
    ['🔧 개선 필요 사항',   wData.summary?.improve || ''],
    ['📌 건의사항',         wData.summary?.suggest || ''],
  ]);

  const sheetNames = [...DAY_NAMES.flatMap(d=>[`${d}_업무`,`${d}_학생`]), '주간_KPI','주간_학생진행','다음주_계획','주간_총평'];
  const wsXml = sheetNames.map(n=>`<ExcelWorksheet><Name>${n}</Name><WorksheetOptions><DisplayGridlines/></WorksheetOptions></ExcelWorksheet>`).join('');

  const xml = `<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
 <DocumentProperties xmlns="urn:schemas-microsoft-com:office:office">
  <Author>${memberName}</Author><Title>주간업무보고서_${weekStr}</Title>
 </DocumentProperties>
 <ExcelWorkbook xmlns="urn:schemas-microsoft-com:office:excel">
  <ExcelWorksheets>${wsXml}</ExcelWorksheets>
 </ExcelWorkbook>
 <Styles>
  <Style ss:ID="Default"><Alignment ss:Vertical="Center" ss:WrapText="1"/>
   <Font ss:FontName="맑은 고딕" ss:Size="11"/>
  </Style>
  <Style ss:ID="header"><Font ss:FontName="맑은 고딕" ss:Size="11" ss:Bold="1"/>
   <Interior ss:Color="#D9E1F2" ss:Pattern="Solid"/>
  </Style>
 </Styles>
 ${sheets}
</Workbook>`;

  const blob = new Blob(['﻿'+xml], {type:'application/vnd.ms-excel;charset=UTF-8'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href=url; a.download=`주간보고서_${memberName}_${weekStr}.xls`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast(`${memberName} 주간보고서 Excel 저장 완료!`);
}

// ═══════════════════════════════════════════════
// INIT (Firebase 인증 후 호출됨)
// ═══════════════════════════════════════════════
async function init() {
  buildUI();
  const weekStr = getWeekStr(today);

  // 1) UI 즉시 렌더 (localStorage 기반)
  MEMBERS.forEach(cfg => {
    const m = cfg.id;
    const dDate = document.getElementById(`${m}-d-date`);
    if (dDate) dDate.value = todayStr;
    const wWeek = document.getElementById(`${m}-w-week`);
    if (wWeek) wWeek.value = weekStr;
    loadDailyView(m, todayStr);
    updateDailyHeader(m, todayStr);
    updateWeeklyHeader(m, weekStr);
  });
  setSaveDot('saved');

  // 2) Firestore에서 최신 데이터 가져와 동기화
  showToast('☁️ 클라우드에서 데이터 동기화 중...');
  await Promise.all(MEMBERS.flatMap(cfg => [
    S.syncFromCloud(S.dKey(cfg.id, todayStr)).then(data => {
      if (data) loadDailyView(cfg.id, todayStr);
    }),
    S.syncFromCloud(S.wKey(cfg.id, weekStr)).then(data => {
      if (data) { /* 주간은 탭 열 때 로드 */ }
    }),
  ]));
  showToast('✅ 동기화 완료!');

  // 3) 현재 활성 멤버(me) 실시간 구독 시작
  S.subscribe(S.dKey('me', todayStr), () => {
    const active = document.querySelector('#panel-me .report-view.active');
    if (active?.id === 'me-daily') loadDailyView('me', todayStr);
  });
}
